# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "config", "tests"]

[processor.pylint]
src_dirs = ["src", "config", "tests"]

[processor.mypy]
src_dirs = ["src", "config", "tests"]

[processor.pytest]
src_dirs = ["tests"]

[processor.luacheck]
src_dirs = ["config"]

# ─── documentation ───────────────────────────────────────────────────────────

# build the Sphinx documentation from sphinx/ into docs/; autodoc imports the
# package from src/, so the sources are inputs too
# CI uploads this directory as the Pages artifact, replacing the old
# "legacy" mode that served docs/ straight off master. The sphinx processor
# below generates it, so it is build output and no longer committed.
[pages]
dir = "docs"

[processor.sphinx]
src_dirs = ["sphinx"]
output_dir = "docs"
dep_inputs = ["src/pyscrapers/*.py"]
# -E -a: full cold build every run, no incremental caching; -d keeps the
# (now write-only) doctree cache out of docs/, which is published to Pages
args = ["-d", "out/sphinx-doctrees", "-E", "-a"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

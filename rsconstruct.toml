# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

[processor.checker.ruff]
src_dirs = ["src", "config", "tests"]


[processor.checker.pyrefly]
src_dirs = ["src", "config", "tests"]

[processor.checker.pytest]
src_dirs = ["tests"]

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── documentation ───────────────────────────────────────────────────────────

# build the Sphinx documentation from sphinx/ into docs/; autodoc imports the
# package from src/, so the sources are inputs too
# CI uploads this directory as the Pages artifact, replacing the old
# "legacy" mode that served docs/ straight off master. The sphinx processor
# below generates it, so it is build output and no longer committed.
[pages]
dir = "docs"

# Sphinx plans its own output: every page, index and static file is a product,
# restored from cache when nothing it depends on changed. All of them depend on
# what Sphinx reads outside sphinx/: the package autodoc imports from src/, and
# pyproject.toml and uv.lock, which conf.py reads for the version and the
# pinned toolchain.
[processor.mass_generator.sphinx]
output_dir = "docs"
dep_inputs = ["src/pyscrapers/**/*.py", "pyproject.toml", "uv.lock"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

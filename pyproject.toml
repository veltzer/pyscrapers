[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyscrapers"
version = "0.0.67"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "project to produce various useful scrapers"
readme = "README.md"
license = "MIT"
keywords=[
    "scrape",
    "images",
    "social",
    "facebook",
    "instagram",
    "vk",
    "download",
    "pics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "lxml",
    "requests",
    "browser-cookie3",
    "pytconf",
    "pylogconf",
    "youtube-dl",
    "pyeventroute",
    "fake-useragent",
    "tqdm",
    "beautifulsoup4",
    "pydantic",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pyscrapers"
"Bug Tracker" = "https://github.com/veltzer/pyscrapers/issues"
"Documentation" = "https://veltzer.github.io/pyscrapers"
"Download" = "https://pypi.org/project/pyscrapers/"
"Repository" = "https://github.com/veltzer/pyscrapers"

[project.scripts]
pyscrapers = "pyscrapers.main:main"

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyscrapers"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyscrapers/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
python-version = "3.14"
search-path = [
    "src",
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-type-argument = "error"
instance-var-assign = "error"
method-assign = "error"
missing-override-decorator = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
    "lxml-stubs",
    "types-requests",
    "types-tqdm",
]
